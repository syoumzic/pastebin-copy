<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="../static/auth.css" th:href="@{/auth.css}">
</head>
<body>
<div class="container">
    <div class="logo">PasteBinCopy</div>
    <form class="form" method="POST" th:action="@{/registration}">
        <div class="form-field">
            <label class="form-label" for="username">Username:</label>
            <input class="form-textarea" type="text" id="username" name="username"/>
        </div>
        <div class="form-field">
            <label class="form-label" for="password">Password:</label>
            <input class="form-textarea" type="text" id="password" name="password"/>
        </div>
        <div class="form-field">
            <label class="form-label" for="confirmPassword">Confirm password:</label>
            <input class="form-textarea" type="text" id="confirmPassword" name="confirmPassword"/>
        </div>
        <div class="form-field">
            <label class="form-label" for="fullName">Full name:</label>
            <input class="form-textarea" type="text" id="fullName" name="fullName"/>
        </div>
        <input class="form-submit" type="submit" id="submit" value="Register"/>
    </form>
</div>
</body>
</html>
