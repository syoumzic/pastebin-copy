<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Share your code</title>
    <link rel="stylesheet" href="../static/code.css" th:href="@{/code.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">PasteBinCopy</div>
    </div>
    <form id="code-form" class="main" method="POST" th:action="@{/design}">
        <span class="control-panel">
            <button type="submit" class="control-panel-button">
                <span class="material-icons">arrow_outward</span>
                <span>Share</span>
            </button>
        </span>
        <label class="code-editor-area">
            <textarea autocomplete="off"
                      autofocus
                      required
                      spellcheck="false"
                      name="code"
                      class="code-editor-text-area"
                      placeholder="Paste your code here">
            </textarea>
        </label>
    </form>
    <div class="footer">
        <a href="https://gitlab.com/Syoumzic" class="footer-link">Gitlab</a>
        <a href="https://github.com/syoumzic" class="footer-link">GitHub</a>
    </div>
</div>
</body>
</html>
